[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letterboxd-stats-builder"
version = "0.1.0"
description = "Build a static stats page from your Letterboxd data export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robert Lunt" }]
dependencies = []

[project.scripts]
lsb = "letterboxd_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
letterboxd_stats = ["templates/*.html"]
